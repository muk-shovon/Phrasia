[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phrasia"
version = "0.1.0"
description = "Phrasia — An intelligent workspace for better writing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Phrasia Owner" }]
dependencies = [
    "reflex>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-docx>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "providers*", "infrastructure*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]